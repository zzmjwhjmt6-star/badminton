<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Home-screen frame for the Nagoya Badminton app (hosted on GitHub Pages).
  - Shows the Apps Script web app inside an iframe, so Google's "created by a Google Apps Script user"
    bar does not appear (Google shows it only when the web app is the top-level page).
  - No URL or token is stored in this file. The personal link carries them after "#":
      https://<user>.github.io/<repo>/#a=<deployment id>&k=<personal token>
    The part after "#" never leaves the phone (browsers do not send it to GitHub).
    The frame keeps it in this device's storage so the home-screen icon opens straight into the app.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Badminton">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161b" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Badminton</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1d232b; --muted: #66707c; --line: #e2e6eb;
    --accent: #0b6e4f; --accent-ink: #ffffff; --warn: #8a1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b; --card: #1b2128; --ink: #e7ebef; --muted: #9aa5b1; --line: #2b333d;
      --accent: #3fb68b; --accent-ink: #08130e; --warn: #f4b4b4;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  /* เว้นขอบบนเท่าแถบสถานะ (โหมดเต็มจอบน iPhone) ไม่ให้เนื้อหาโดนนาฬิกาบัง */
  #app {
    position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top);
    width: 100%; height: calc(100% - env(safe-area-inset-top)); border: 0; background: var(--bg); visibility: hidden;
  }
  #app.ready { visibility: visible; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  .spin {
    display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #setup { max-width: 480px; margin: 0 auto; padding: 40px 16px; }
  .logo { width: 64px; height: 64px; border-radius: 15px; display: block; margin-bottom: 14px; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.01em; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); outline: none; -webkit-appearance: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    margin-top: 12px; width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .err { color: var(--warn); font-size: 14px; min-height: 21px; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="loading" hidden><span><span class="spin"></span>Opening…</span></div>
<iframe id="app" title="Nagoya Badminton" allow="clipboard-write" hidden></iframe>

<main id="setup" hidden>
  <img class="logo" src="icon-180.png" alt="">
  <h1>Nagoya Badminton</h1>
  <p>Open the personal link you were given. It looks like
    <b>…github.io/…/#a=…&amp;k=…</b></p>
  <form id="form" autocomplete="off">
    <label for="link">Or paste your link here</label>
    <input id="link" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="https://…#a=…&k=…">
    <div class="err" id="err"></div>
    <button type="submit">Open</button>
  </form>
  <p style="margin-top:16px">The link is kept on this device only. Do not share it — anyone with it can book on the shared account.</p>
</main>

<script>
(function () {
  'use strict';
  var KEY = 'nb.app.v1';
  var DEP_RE = /^AKfy[\w-]{20,120}$/;
  var TOK_RE = /^[\w-]{20,200}$/;
  function $(id) { return document.getElementById(id); }

  /** อ่าน a (deployment id) + k (token) จาก "#a=…&k=…" หรือจาก URL ของ Apps Script (/macros/s/<id>/exec?k=…) */
  function parse(text) {
    text = String(text || '').trim();
    var a = '', k = '';
    var m = /\/macros\/s\/([\w-]+)\/exec\?(?:[^#]*&)?k=([\w-]+)/.exec(text);
    if (m) { a = m[1]; k = m[2]; }
    var h = text.indexOf('#') >= 0 ? text.slice(text.indexOf('#') + 1) : text;
    h.split('&').forEach(function (part) {
      var i = part.indexOf('=');
      if (i <= 0) return;
      var name = part.slice(0, i), value = decodeURIComponent(part.slice(i + 1));
      if (name === 'a') a = value;
      if (name === 'k') k = value;
    });
    return DEP_RE.test(a) && TOK_RE.test(k) ? { a: a, k: k } : null;
  }
  function load() {
    try { return parse(localStorage.getItem(KEY) || ''); } catch (e) { return null; }
  }
  function save(app) {
    try { localStorage.setItem(KEY, '#a=' + app.a + '&k=' + app.k); } catch (e) { /* โหมดส่วนตัว: ใช้จากลิงก์อย่างเดียว */ }
  }

  function open(app) {
    $('setup').hidden = true;
    $('loading').hidden = false;
    var f = $('app');
    f.hidden = false;
    f.onload = function () { f.classList.add('ready'); $('loading').hidden = true; };
    f.src = 'https://script.google.com/macros/s/' + app.a + '/exec?k=' + encodeURIComponent(app.k);
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var app = parse($('link').value);
    if (!app) { $('err').textContent = 'This does not look like an app link. Copy the whole link and try again.'; return; }
    save(app);
    // ใส่ไว้ท้าย URL ด้วย เพื่อให้ "Add to Home Screen" จำลิงก์นี้ไปกับไอคอน
    try { history.replaceState(null, '', '#a=' + app.a + '&k=' + app.k); } catch (e2) { /* ไม่เป็นไร */ }
    open(app);
  });

  // ลิงก์ใหม่ใน URL มาก่อนเสมอ (เช่นเพื่อนได้ลิงก์ใหม่) ไม่งั้นใช้ที่เครื่องจำไว้
  var fromUrl = parse(location.hash);
  var app = fromUrl || load();
  if (fromUrl) save(fromUrl);
  if (app) open(app); else $('setup').hidden = false;

  // แตะลิงก์ใหม่ตอนหน้านี้เปิดอยู่ (เปลี่ยนแค่ส่วน #) → เปิดตามลิงก์ใหม่
  window.addEventListener('hashchange', function () {
    var next = parse(location.hash);
    if (!next) return;
    save(next);
    open(next);
  });
})();
</script>
</body>
</html>
